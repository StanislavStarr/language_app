name: mobile

on:
  push:
    branches: [master]
    paths:
      - "mobile/**"
      - "backend/openapi.json"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "backend/openapi.json"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:fsd
      - run: npm run format:check
      - run: npm test
      - name: Check generated API types match backend/openapi.json
        run: |
          npm run api:generate
          git diff --exit-code -- src/shared/api/schema.d.ts || {
            echo "schema.d.ts is stale: run 'make api-types' and commit the result"
            exit 1
          }
